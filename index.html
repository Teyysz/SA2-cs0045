/* =========================================================================
   LOAD / SWITCH
========================================================================= */
function showValidationReport(){
  const errors = validateAllSets();
  if(errors.length){
    els.validationBanner.style.display = 'block';
    els.validationBanner.textContent = 'Question data warnings:\n' + errors.map(e=>'• ' + e).join('\n');
  } else {
    els.validationBanner.style.display = 'none';
    els.validationBanner.textContent = '';
  }
}

function loadSet(setId){
  activeSetId = setId;
  const {validQuestions} = validateSet(setId, QUESTION_SETS[setId]);
  allQuestions = validQuestions;
  els.setTitle.textContent = QUESTION_SETS[setId].title;
  els.setSelect.value = setId;
  loadBookmarks();
  refreshModeTabs();
  restoreOrStartSession();
  showScreen('quiz');
}

function switchMode(mode){
  activeMode = mode;
  refreshModeTabs();
  restoreOrStartSession();
  showScreen('quiz');
}

function validOrder(o){
  return Array.isArray(o) && o.length > 0 &&
    o.every(i=> Number.isInteger(i) && i >= 0 && i < allQuestions.length) &&
    new Set(o).size === o.length;
}

function restoreOrStartSession(){
  const saved = loadSession();
  optionOrderMap = {};
  if(saved && validOrder(saved.order)){
    order = saved.order;
    current = Math.min(Math.max(saved.current || 0, 0), order.length-1);
    answers = (saved.answers && typeof saved.answers === 'object') ? saved.answers : {};
    finished = !!saved.finished;
    // drop answers for ids no longer present
    const liveIds = new Set(allQuestions.map(q=>q.id));
    Object.keys(answers).forEach(k=>{ if(!liveIds.has(k)) delete answers[k]; });
  } else {
    startFreshSession();
  }
  render();
}

function startFreshSession(){
  let idxs = allQuestions.map((_,i)=>i);
  if(settings.shuffleQ) idxs = shuffle(idxs);
  order = idxs;
  current = 0;
  answers = {};
  finished = false;
  optionOrderMap = {};
  saveSession();
}

/* =========================================================================
   HELPERS
========================================================================= */
function currentQ(){ return allQuestions[order[current]]; }
function getOpts(q){
  if(q.type !== 'single' && q.type !== 'multi') return null;
  if(!settings.shuffleO) return q.opts;
  if(!optionOrderMap[q.id]) optionOrderMap[q.id] = shuffle(q.opts);
  return optionOrderMap[q.id];
}
function hasSelection(q){
  const a = answers[q.id];
  if(!a) return false;
  if(q.type === 'single') return !!a.selected;
  if(q.type === 'multi') return Array.isArray(a.selected) && a.selected.length > 0;
  if(q.type === 'code_blank') return a.selected && Object.values(a.selected).some(v=> typeof v === 'string' && v.trim());
  return false;
}
function isAttempted(q){
  const a = answers[q.id];
  if(!a) return false;
  if(q.type === 'single') return !!a.selected;
  if(q.type === 'multi') return Array.isArray(a.selected) && a.selected.length > 0;
  if(q.type === 'code_blank') return a.selected && q.blanks.every(b=> typeof a.selected[b.id] === 'string' && a.selected[b.id].trim());
  return false;
}
function normalizeForGrade(text, caseSensitive){
  const t = String(text == null ? '' : text).trim().replace(/\s+/g,' ');
  return caseSensitive === false ? t.toLowerCase() : t;
}
function gradeQuestion(q, selected){
  if(q.type === 'single'){
    return {correct: selected === q.ans, perBlank:null, blanksCorrect:0, blanksTotal:0};
  }
  if(q.type === 'multi'){
    const sel = Array.isArray(selected) ? selected.slice().sort() : [];
    const ans = q.ans.slice().sort();
    return {correct: sel.length === ans.length && sel.every((v,i)=>v===ans[i]), perBlank:null, blanksCorrect:0, blanksTotal:0};
  }
  if(q.type === 'code_blank'){
    let allOk = true, okCount = 0;
    const perBlank = {};
    q.blanks.forEach(b=>{
      const cs = b.caseSensitive !== false; // OpenGL / GLUT identifiers: case-sensitive by default
      const norm = normalizeForGrade((selected && selected[b.id]) || '', cs);
      const candidates = [b.answer, ...(b.accepted||[])].map(a=> normalizeForGrade(a, cs));
      const ok = norm.length > 0 && candidates.includes(norm);
      perBlank[b.id] = ok;
      if(ok) okCount++; else allOk = false;
    });
    return {correct: allOk, perBlank, blanksCorrect: okCount, blanksTotal: q.blanks.length};
  }
  return {correct:false, perBlank:null, blanksCorrect:0, blanksTotal:0};
}
function solvedCode(q){
  return q.code.replace(/__BLANK_(\d+)__/g, (m, id)=>{
    const b = q.blanks.find(x=>String(x.id) === String(id));
    return b ? b.answer : m;
  });
}

/* =========================================================================
   RENDER
========================================================================= */
function showScreen(name){
  els.quizScreen.style.display = name==='quiz' ? 'block':'none';
  els.resultsScreen.style.display = name==='results' ? 'block':'none';
  els.reviewScreen.style.display = name==='review' ? 'block':'none';
  els.historyScreen.style.display = name==='history' ? 'block':'none';
}

function render(){
  els.qBody.textContent = '';
  els.feedbackBox.className = '';
  els.feedbackBox.textContent = '';
  els.solutionBox.textContent = '';

  const q = currentQ();
  if(!q){
    els.qStem.textContent = 'No questions available in this set.';
    els.qCounter.textContent = 'Question 0 / 0';
    els.submitBtn.style.display = 'none';
    els.tryAgainBtn.style.display = 'none';
    els.finishBtn.style.display = 'none';
    els.prevBtn.disabled = true; els.nextBtn.disabled = true;
    updateSidebar();
    return;
  }
  els.nextBtn.disabled = false;

  els.qCounter.textContent = `Question ${current+1} / ${order.length}`;
  els.qTypeTag.textContent = q.type === 'code_blank' ? 'FILL IN THE CODE' : (q.type === 'multi' ? 'MULTI-SELECT' : 'MULTIPLE CHOICE');
  els.qDiffTag.textContent = q.difficulty;
  els.qDiffTag.className = 'tag difficulty-' + q.difficulty;
  els.qTopicTag.textContent = q.topic;

  const isBm = bookmarks.has(q.id);
  els.bookmarkBtn.textContent = isBm ? '★ Bookmarked' : '☆ Bookmark';
  els.bookmarkBtn.classList.toggle('on', isBm);

  const rec = answers[q.id] || {};
  const isLocked = (activeMode !== 'exam' && !!rec.submitted) || (activeMode === 'exam' && finished);

  els.qStem.textContent = q.stem;

  if(q.type === 'code_blank') renderCodeBlank(q, isLocked);
  else renderChoices(q, rec, isLocked);

  if(activeMode === 'exam'){
    els.submitBtn.style.display = 'none';
    els.tryAgainBtn.style.display = 'none';
    els.finishBtn.style.display = finished ? 'none' : 'inline-block';
  } else {
    els.tryAgainBtn.style.display = (rec.submitted && rec.correct === false && activeMode === 'practice') ? 'inline-block' : 'none';
    els.submitBtn.style.display = isLocked ? 'none' : 'inline-block';
    els.submitBtn.disabled = !hasSelection(q);
    els.finishBtn.style.display = 'inline-block';
  }

  if(isLocked && rec.submitted){
    const grade = gradeQuestion(q, rec.selected);
    els.feedbackBox.className = grade.correct ? 'ok' : 'bad';
    els.feedbackBox.appendChild(document.createTextNode(grade.correct ? '✔ Correct!' : '✘ Not quite.'));
    if(q.type === 'code_blank' && grade.blanksTotal > 1){
      const p = document.createElement('div');
      p.className = 'partial';
      p.textContent = `Partial progress: ${grade.blanksCorrect} of ${grade.blanksTotal} blanks correct.`;
      els.feedbackBox.appendChild(p);
    }
    if(q.explanation){
      const e = document.createElement('div');
      e.className = 'expl';
      e.textContent = q.explanation;
      els.feedbackBox.appendChild(e);
    }
    if(q.type === 'code_blank'){
      const lbl = document.createElement('div');
      lbl.className = 'solutionLabel';
      lbl.textContent = 'Completed code';
      const pre = document.createElement('pre');
      pre.className = 'code solution';
      pre.textContent = solvedCode(q);
      els.solutionBox.appendChild(lbl);
      els.solutionBox.appendChild(pre);
    }
  }

  els.prevBtn.disabled = current === 0;
  els.nextBtn.textContent = current === order.length-1 ? 'Finish ▸' : 'Next ▸';
  updateSidebar();
  saveSession();
}

function renderChoices(q, rec, isLocked){
  const multi = q.type === 'multi';
  const opts = getOpts(q);
  const wrap = document.createElement('div'); wrap.className = 'choiceList';
  opts.forEach(([k,v], idx)=>{
    const div = document.createElement('label');
    div.className = 'choice' + (isLocked ? ' locked' : '');

    const input = document.createElement('input');
    input.type = multi ? 'checkbox' : 'radio';
    input.name = 'choice_' + q.id;
    input.disabled = isLocked;
    if(multi) input.checked = Array.isArray(rec.selected) && rec.selected.includes(k);
    else input.checked = rec.selected === k;

    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = String.fromCharCode(65+idx);

    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = v;

    div.appendChild(input); div.appendChild(letter); div.appendChild(txt);

    if(!isLocked && (multi ? input.checked : rec.selected === k)) div.classList.add('selected');

    input.onchange = ()=>{
      const r = answers[q.id] = answers[q.id] || {};
      if(multi){
        const set = new Set(Array.isArray(r.selected) ? r.selected : []);
        if(input.checked) set.add(k); else set.delete(k);
        r.selected = Array.from(set);
      } else {
        r.selected = k;
      }
      if(activeMode === 'exam') r.submitted = false;
      saveSession();
      render();
    };

    if(isLocked){
      const isCorrectKey = multi ? q.ans.includes(k) : k === q.ans;
      const wasPicked = multi ? (Array.isArray(rec.selected) && rec.selected.includes(k)) : rec.selected === k;
      if(isCorrectKey) div.classList.add('showCorrect');
      else if(wasPicked) div.classList.add('showWrong');
    }

    wrap.appendChild(div);
  });
  els.qBody.appendChild(wrap);
}

function renderCodeBlank(q, isLocked){
  if(!answers[q.id]) answers[q.id] = {selected:{}};
  if(!answers[q.id].selected || typeof answers[q.id].selected !== 'object') answers[q.id].selected = {};
  const rec = answers[q.id];
  const grade = isLocked ? gradeQuestion(q, rec.selected) : null;

  const pre = document.createElement('pre'); pre.className = 'code';
  const parts = q.code.split(/__BLANK_(\d+)__/g);
  parts.forEach((part, i)=>{
    if(i % 2 === 0){
      pre.appendChild(document.createTextNode(part));
    } else {
      const blankId = Number(part);
      const blankDef = q.blanks.find(b=>b.id===blankId);
      if(isLocked){
        const val = rec.selected[blankId] || '';
        const ok = grade.perBlank ? !!grade.perBlank[blankId] : false;
        const span = document.createElement('span');
        span.className = 'blankResult ' + (ok ? 'ok' : 'bad');
        span.textContent = val.trim() ? val : '(blank)';
        pre.appendChild(span);
        if(!ok && blankDef){
          const hint = document.createElement('span');
          hint.className = 'blankCorrectHint';
          hint.textContent = '→ ' + blankDef.answer;
          pre.appendChild(hint);
        }
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'blankInput';
        input.autocomplete = 'off';
        input.spellcheck = false;
        input.value = rec.selected[blankId] || '';
        input.setAttribute('aria-label', 'Blank ' + blankId);
        input.size = Math.max(14, Math.min(40, (blankDef ? blankDef.answer.length : 16)));
        input.oninput = ()=>{
          rec.selected[blankId] = input.value;
          saveSession();
          refreshActionButtons();
          updateSidebar();
        };
        pre.appendChild(input);
      }
    }
  });
  els.qBody.appendChild(pre);
}

function refreshActionButtons(){
  const q = currentQ();
  if(!q) return;
  if(els.submitBtn.style.display !== 'none') els.submitBtn.disabled = !hasSelection(q);
}

function updateSidebar(){
  const attempted = order.filter(i=> isAttempted(allQuestions[i]) ).length;
  const correctCount = order.filter(i=>{
    const rec = answers[allQuestions[i].id];
    return rec && rec.submitted && rec.correct;
  }).length;
  els.attemptedText.textContent = `${attempted} / ${order.length}`;
  els.correctText.textContent = String(correctCount);
  els.bookmarkedText.textContent = String(bookmarks.size);
  els.progressBarInner.style.width = (order.length ? attempted/order.length*100 : 0) + '%';

  els.navGrid.textContent = '';
  order.forEach((qi, pos)=>{
    const q = allQuestions[qi];
    const rec = answers[q.id];
    const btn = document.createElement('div');
    btn.className = 'navBtn';
    btn.textContent = String(pos+1);
    btn.title = q.topic;
    if(rec && rec.submitted){
      btn.classList.add(rec.correct ? 'correct' : 'incorrect');
    } else if(hasSelection(q)){
      btn.classList.add('picked');
    }
    if(pos === current) btn.classList.add('current');
    if(bookmarks.has(q.id)){
      const dot = document.createElement('div'); dot.className='bmDot'; btn.appendChild(dot);
    }
    btn.onclick = ()=>{ current = pos; render(); };
    els.navGrid.appendChild(btn);
  });
}

/* =========================================================================
   ACTIONS
========================================================================= */
els.bookmarkBtn.onclick = ()=>{
  const q = currentQ(); if(!q) return;
  if(bookmarks.has(q.id)) bookmarks.delete(q.id); else bookmarks.add(q.id);
  saveBookmarks();
  render();
};

els.submitBtn.onclick = ()=>{
  const q = currentQ(); if(!q || !hasSelection(q)) return;
  const rec = answers[q.id] = answers[q.id] || {};
  const result = gradeQuestion(q, rec.selected);
  rec.submitted = true;
  rec.correct = result.correct;
  rec.attempts = (rec.attempts||0) + 1;
  saveSession();
  render();
};

els.tryAgainBtn.onclick = ()=>{
  const q = currentQ(); if(!q) return;
  const rec = answers[q.id] = answers[q.id] || {};
  rec.submitted = false;
  delete rec.correct;
  if(q.type === 'code_blank') rec.selected = {};
  else if(q.type === 'multi') rec.selected = [];
  else rec.selected = null;
  saveSession();
  render();
};

els.prevBtn.onclick = ()=>{ if(current>0){ current--; render(); } };
els.nextBtn.onclick = ()=>{
  if(current < order.length-1){ current++; render(); }
  else { finishRun(); }
};
els.finishBtn.onclick = finishRun;

function computeTopicBreakdown(){
  const byTopic = {};
  order.forEach(qi=>{
    const q = allQuestions[qi];
    const rec = answers[q.id];
    if(!byTopic[q.topic]) byTopic[q.topic] = {correct:0, total:0};
    byTopic[q.topic].total++;
    if(rec && rec.submitted && rec.correct) byTopic[q.topic].correct++;
  });
  return byTopic;
}

function finishRun(){
  if(!order.length) return;
  const unanswered = order.filter(i=> !isAttempted(allQuestions[i]) ).length;
  if(unanswered > 0){
    const msg = `${unanswered} question${unanswered===1?'':'s'} ${unanswered===1?'is':'are'} still unanswered. ` +
                `Unanswered questions count as incorrect in the overall score. Finish anyway?`;
    if(!window.confirm(msg)) return;
  }

  if(activeMode === 'exam'){
    order.forEach(qi=>{
      const q = allQuestions[qi];
      const rec = answers[q.id] = answers[q.id] || {};
      rec.correct = isAttempted(q) ? gradeQuestion(q, rec.selected).correct : false;
      rec.submitted = true;
    });
  }
  finished = true;
  saveSession();

  const attemptedCount = order.filter(i=>isAttempted(allQuestions[i])).length;
  const correctCount = order.filter(i=>{
    const rec = answers[allQuestions[i].id];
    return rec && rec.submitted && rec.correct;
  }).length;
  const topicBreakdown = computeTopicBreakdown();

  pushHistory({
    setId: activeSetId,
    setTitle: QUESTION_SETS[activeSetId].title,
    mode: activeMode,
    date: new Date().toISOString(),
    total: order.length,
    attempted: attemptedCount,
    correct: correctCount,
    topicBreakdown
  });

  showResults(attemptedCount, correctCount, topicBreakdown);
}

function showResults(attemptedCount, correctCount, topicBreakdown){
  showScreen('results');
  const overallPct = order.length>0 ? Math.round(correctCount/order.length*100) : 0;
  const attemptedPct = attemptedCount>0 ? Math.round(correctCount/attemptedCount*100) : 0;
  els.scoreBig.textContent = overallPct + '%';
  els.scoreSub.textContent = `${correctCount} of ${order.length} correct overall  ·  ${attemptedPct}% accuracy on ${attemptedCount} attempted`;
  const skipped = order.length - attemptedCount;
  els.scoreWarn.textContent = skipped > 0
    ? `⚠ ${skipped} question${skipped===1?'':'s'} left unanswered — counted as incorrect.`
    : '';

  els.topicBreakdown.textContent = '';
  const h3 = document.createElement('h3'); h3.textContent = 'Topic Breakdown';
  els.topicBreakdown.appendChild(h3);
  Object.keys(topicBreakdown).forEach(topic=>{
    const t = topicBreakdown[topic];
    const pctT = t.total>0 ? Math.round(t.correct/t.total*100) : 0;
    const row = document.createElement('div'); row.className = 'topicRow';
    const name = document.createElement('div'); name.className = 'tname'; name.textContent = topic;
    const bar = document.createElement('div'); bar.className = 'topicBar';
    const fill = document.createElement('div'); fill.style.width = pctT + '%';
    bar.appendChild(fill);
    const score = document.createElement('div'); score.className = 'tscore'; score.textContent = `${t.correct}/${t.total}`;
    row.appendChild(name); row.appendChild(bar); row.appendChild(score);
    els.topicBreakdown.appendChild(row);
  });

  els.resultsGrid.textContent = '';
  order.forEach((qi,pos)=>{
    const q = allQuestions[qi];
    const rec = answers[q.id];
    let cls = 'unattempted';
    if(rec && rec.submitted) cls = rec.correct ? 'correct' : 'incorrect';
    const box = document.createElement('div');
    box.className = 'rBox ' + cls;
    box.textContent = String(pos+1);
    box.onclick = ()=>{ jumpTo(pos); };
    els.resultsGrid.appendChild(box);
  });
}

function jumpTo(pos){
  showScreen('quiz');
  current = Math.min(Math.max(pos,0), Math.max(order.length-1,0));
  render();
}

els.backToQuizBtn.onclick = ()=>{ jumpTo(current); };
els.retakeBtn.onclick = ()=>{ startFreshSession(); showScreen('quiz'); render(); };
els.retryIncorrectBtn.onclick = ()=>{
  const incorrectIdx = order.filter(qi=>{
    const rec = answers[allQuestions[qi].id];
    return rec && rec.submitted && rec.correct === false;
  });
  if(!incorrectIdx.length){ jumpTo(0); return; }
  order = incorrectIdx;
  current = 0;
  incorrectIdx.forEach(qi=>{
    const q = allQuestions[qi];
    answers[q.id] = {selected: q.type==='code_blank' ? {} : (q.type==='multi' ? [] : null)};
  });
  finished = false;
  saveSession();
  showScreen('quiz');
  render();
};

els.resetSideBtn.onclick = ()=>{
  if(!window.confirm('Reset all progress for this set and mode?')) return;
  startFreshSession();
  showScreen('quiz');
  render();
};

/* ---- Review panel ---- */
els.reviewSideBtn.onclick = ()=>{ renderReview(); showScreen('review'); };
els.closeReviewBtn.onclick = ()=>{ showScreen('quiz'); render(); };
document.querySelectorAll('.filterRow button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.filterRow button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    reviewFilter = btn.dataset.f;
    renderReview();
  };
});
function renderReview(){
  els.reviewList.textContent = '';
  let shown = 0;
  order.forEach((qi,pos)=>{
    const q = allQuestions[qi];
    const rec = answers[q.id] || {};
    const isBm = bookmarks.has(q.id);
    let status = 'unattempted';
    if(rec.submitted) status = rec.correct ? 'correct' : 'incorrect';

    let include = false;
    if(reviewFilter === 'all') include = true;
    else if(reviewFilter === 'incorrect') include = status === 'incorrect';
    else if(reviewFilter === 'unanswered') include = status === 'unattempted';
    else if(reviewFilter === 'bookmarked') include = isBm;
    if(!include) return;
    shown++;

    const item = document.createElement('div'); item.className = 'reviewItem';
    const label = document.createElement('span');
    const firstLine = q.stem.split('\n')[0];
    label.textContent = `${isBm?'★ ':''}Q${pos+1} — ` + (firstLine.length > 90 ? firstLine.slice(0,90) + '…' : firstLine);
    const stat = document.createElement('span');
    stat.className = 'rstat ' + status;
    stat.textContent = status.toUpperCase();
    item.appendChild(label); item.appendChild(stat);
    item.onclick = ()=>{ showScreen('quiz'); current = pos; render(); };
    els.reviewList.appendChild(item);
  });
  if(!shown){
    const empty = document.createElement('div');
    empty.className = 'hint';
    empty.textContent = 'No questions match this filter.';
    els.reviewList.appendChild(empty);
  }
}

/* ---- History panel ---- */
els.historySideBtn.onclick = ()=>{ renderHistory(); showScreen('history'); };
els.closeHistoryBtn.onclick = ()=>{ showScreen('quiz'); render(); };
function renderHistory(){
  const hist = lsGet(LS_HISTORY, []);
  els.historyList.textContent = '';
  if(!Array.isArray(hist) || !hist.length){
    const empty = document.createElement('div');
    empty.className = 'hint';
    empty.textContent = 'No attempts recorded yet.';
    els.historyList.appendChild(empty);
    return;
  }
  hist.forEach(h=>{
    const overall = h.total>0 ? Math.round(h.correct/h.total*100) : 0;
    const acc = h.attempted>0 ? Math.round(h.correct/h.attempted*100) : 0;
    const div = document.createElement('div'); div.className = 'historyItem';

    const top = document.createElement('div'); top.className = 'hTop';
    const left = document.createElement('span');
    left.textContent = `${h.setTitle} — ${String(h.mode||'').toUpperCase()}`;
    const right = document.createElement('span');
    const d = new Date(h.date);
    right.textContent = isNaN(d.getTime()) ? '' : d.toLocaleString();
    top.appendChild(left); top.appendChild(right);

    const body = document.createElement('div');
    body.appendChild(document.createTextNode('Score: '));
    const sc = document.createElement('span'); sc.className = 'hScore'; sc.textContent = overall + '%';
    body.appendChild(sc);
    body.appendChild(document.createTextNode(` (${h.correct}/${h.total} overall · ${acc}% of ${h.attempted} attempted)`));

    div.appendChild(top); div.appendChild(body);
    els.historyList.appendChild(div);
  });
}

/* =========================================================================
   KEYBOARD ACCESSIBILITY
   Shortcuts never fire while the user is typing in a code blank.
========================================================================= */
document.addEventListener('keydown', (e)=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const ae = document.activeElement;
  const tag = ae && ae.tagName;
  const inTextInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (ae && ae.isContentEditable);
  if(els.quizScreen.style.display !== 'block') return;

  if(e.key === 'Enter'){
    if(inTextInput && tag !== 'BUTTON'){
      if(!els.submitBtn.disabled && els.submitBtn.style.display !== 'none'){
        if(ae && ae.blur) ae.blur();
        els.submitBtn.click();
        e.preventDefault();
      }
      return;
    }
    if(!els.submitBtn.disabled && els.submitBtn.style.display !== 'none'){ els.submitBtn.click(); e.preventDefault(); }
    else { els.nextBtn.click(); e.preventDefault(); }
    return;
  }
  if(inTextInput) return;

  if(e.key === 'ArrowRight'){ els.nextBtn.click(); e.preventDefault(); }
  else if(e.key === 'ArrowLeft'){ if(!els.prevBtn.disabled) els.prevBtn.click(); e.preventDefault(); }
  else if(e.key.toLowerCase() === 'b'){ els.bookmarkBtn.click(); e.preventDefault(); }
  else if(['1','2','3','4','5','6'].includes(e.key)){
    const q = currentQ();
    if(q && (q.type === 'single' || q.type === 'multi')){
      const idx = Number(e.key)-1;
      const inputs = els.qBody.querySelectorAll('.choice input');
      if(inputs[idx] && !inputs[idx].disabled){ inputs[idx].click(); e.preventDefault(); }
    }
  }
});

/* =========================================================================
   INIT
========================================================================= */
showValidationReport();
refreshModeTabs();
loadSet(activeSetId);
</script>
