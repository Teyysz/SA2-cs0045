<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Programming Graphics Reviewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0d1117;
    --panel:#131a24;
    --panel-2:#171f2c;
    --line:#25313f;
    --text:#dbe4ee;
    --dim:#7c8a9c;
    --accent:#39d98a;
    --accent-dim:#1f6b48;
    --bad:#ff6b6b;
    --bad-dim:#5c2626;
    --amber:#f0b64c;
    --blue:#5aa9e6;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, Segoe UI, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(57,217,138,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--accent-dim);}
  button{font-family:var(--mono);}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:290px; flex:0 0 290px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:18px 16px 16px;
    display:flex; flex-direction:column; gap:12px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{font-family:var(--mono); font-size:12px; letter-spacing:.12em; color:var(--accent); text-transform:uppercase;}
  .brand-sub{font-size:17px; font-weight:600; line-height:1.25; margin-top:4px;}

  .sideBlock{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
  .sideBlock label{font-family:var(--mono); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:6px;}
  select.sideSelect{
    width:100%; background:#0a0f16; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:8px 9px; font-family:var(--mono); font-size:12.5px;
  }

  #modeTabs{display:flex; gap:6px;}
  .modeTab{
    flex:1; text-align:center; padding:8px 4px; border-radius:6px; border:1px solid var(--line);
    background:#0a0f16; color:var(--dim); font-family:var(--mono); font-size:11.5px; cursor:pointer;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .modeTab.active{background:rgba(57,217,138,0.14); color:var(--accent); border-color:var(--accent);}

  .toggleRow{display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:12px; margin-bottom:6px;}
  .toggleRow:last-child{margin-bottom:0;}
  .switch{position:relative; width:34px; height:18px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; cursor:pointer; inset:0; background:#0a0f16; border:1px solid var(--line); border-radius:18px; transition:.15s;}
  .slider:before{content:""; position:absolute; height:12px; width:12px; left:2px; top:2px; background:var(--dim); border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:rgba(57,217,138,0.2); border-color:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(15px); background:var(--accent);}

  #scoreWrap .row{display:flex; justify-content:space-between; margin-bottom:4px; font-family:var(--mono); font-size:12px;}
  #scoreWrap .row:last-child{margin-bottom:0;}
  #scoreWrap .val{color:var(--accent);}
  #progressBarOuter{height:6px; background:#0a0f16; border-radius:4px; overflow:hidden; margin-top:8px; border:1px solid var(--line);}
  #progressBarInner{height:100%; width:0%; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); transition:width .25s ease;}

  #navGrid{display:grid; grid-template-columns:repeat(6,1fr); gap:5px; overflow-y:auto; max-height:180px;}
  .navBtn{
    aspect-ratio:1/1; border:1px solid var(--line); background:var(--panel-2); color:var(--dim);
    font-family:var(--mono); font-size:10.5px; border-radius:6px; position:relative;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:all .15s ease;
  }
  .navBtn:hover{border-color:var(--accent); color:var(--text);}
  .navBtn.picked{background:rgba(240,182,76,0.1); color:var(--amber); border-color:rgba(240,182,76,0.4);}
  .navBtn.current{outline:2px solid var(--accent); outline-offset:1px;}
  .navBtn.correct{background:rgba(57,217,138,0.18); color:var(--accent); border-color:var(--accent);}
  .navBtn.incorrect{background:rgba(255,107,107,0.15); color:var(--bad); border-color:var(--bad);}
  .navBtn .bmDot{position:absolute; top:1px; right:1px; width:5px; height:5px; border-radius:50%; background:var(--amber);}

  .sideActionBtn{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    font-family:var(--mono); font-weight:600; font-size:11.5px; letter-spacing:.02em;
    padding:9px; border-radius:8px; cursor:pointer; text-transform:uppercase; width:100%;
  }
  .sideActionBtn:hover{border-color:var(--accent); color:var(--accent);}
  .sideActionBtn.primary{background:var(--accent); color:#0a1510; border:none;}
  .sideActionBtn.primary:hover{filter:brightness(1.08); color:#0a1510;}

  #validationBanner{
    display:none; background:rgba(255,107,107,0.08); border:1px solid var(--bad-dim);
    color:var(--bad); font-family:var(--mono); font-size:11px; border-radius:8px; padding:8px 10px;
    max-height:120px; overflow-y:auto; white-space:pre-wrap;
  }

  /* ---------- Main ---------- */
  #main{flex:1; padding:32px 44px 70px; max-width:920px; margin:0 auto; min-width:0;}
  .topBar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .topBar h1{font-size:18px; margin:0; font-family:var(--mono);}
  .panelTabs{display:flex; gap:6px;}
  .panelTab{
    padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--dim); font-family:var(--mono); font-size:11.5px; cursor:pointer;
  }
  .panelTab.active{background:rgba(90,169,230,0.12); color:var(--blue); border-color:var(--blue);}

  .qMeta{font-family:var(--mono); font-size:12px; color:var(--dim); display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .qMeta .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .qMeta .tag{border:1px solid var(--line); padding:2px 8px; border-radius:20px;}
  .tag.difficulty-Easy{color:var(--accent);}
  .tag.difficulty-Medium{color:var(--amber);}
  .tag.difficulty-Hard{color:var(--bad);}
  #bookmarkBtn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--dim);
    border-radius:6px; padding:5px 10px; cursor:pointer; font-family:var(--mono); font-size:12px;
  }
  #bookmarkBtn.on{color:var(--amber); border-color:var(--amber); background:rgba(240,182,76,0.1);}

  .qStem{font-size:16.5px; line-height:1.6; white-space:pre-wrap; margin-bottom:14px;}
  pre.code{
    background:#0a0f16; border:1px solid var(--line); border-left:3px solid var(--accent-dim);
    border-radius:6px; padding:16px 18px; font-family:var(--mono); font-size:13px;
    line-height:1.6; overflow-x:auto; color:#b9e6cd; margin:0 0 16px; white-space:pre-wrap;
  }
  pre.code.solution{border-left-color:var(--accent);}
  .solutionLabel{font-family:var(--mono); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px;}
  .hint{font-family:var(--mono); font-size:11.5px; color:var(--dim); margin:-6px 0 14px;}

  .choiceList{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .choice{
    display:flex; gap:12px; align-items:flex-start; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice:hover{border-color:var(--accent-dim);}
  .choice input{margin-top:3px; accent-color:var(--accent);}
  .choice .letter{font-family:var(--mono); color:var(--dim); font-size:12px; min-width:16px;}
  .choice .txt{white-space:pre-wrap; font-size:14.5px; line-height:1.5;}
  .choice.selected{border-color:var(--accent); background:rgba(57,217,138,0.06);}
  .choice.showCorrect{border-color:var(--accent); background:rgba(57,217,138,0.14);}
  .choice.showWrong{border-color:var(--bad); background:rgba(255,107,107,0.1);}
  .choice.locked{cursor:default;}

  input.blankInput{
    background:#0d1520; color:var(--amber); border:1px solid var(--line); border-bottom:2px solid var(--blue);
    border-radius:4px; padding:2px 6px; font-family:var(--mono); font-size:13px; min-width:70px;
    width:auto; margin:0 2px;
  }
  input.blankInput:focus{outline:none; border-color:var(--accent);}
  span.blankResult{padding:2px 6px; border-radius:4px; font-family:var(--mono); font-size:13px; margin:0 2px; display:inline-block;}
  span.blankResult.ok{background:rgba(57,217,138,0.18); color:var(--accent);}
  span.blankResult.bad{background:rgba(255,107,107,0.15); color:var(--bad); text-decoration:line-through;}
  span.blankCorrectHint{color:var(--accent); font-size:12px; margin-left:4px;}

  #actionRow{display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  #actionRow button{
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.02em;
    padding:10px 20px; border-radius:8px; border:none;
    background:var(--accent); color:#0a1510; cursor:pointer; text-transform:uppercase;
  }
  #actionRow button:hover{filter:brightness(1.08);}
  #actionRow button:disabled{opacity:.35; cursor:not-allowed; filter:none;}
  #actionRow button.secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  #actionRow button.secondary:hover{border-color:var(--accent); color:var(--accent); filter:none;}
  #actionRow button.warn{background:var(--amber); color:#221a05;}

  #feedbackBox{margin-top:4px; margin-bottom:12px; padding:12px 14px; border-radius:8px; font-family:var(--mono); font-size:13px; display:none;}
  #feedbackBox.ok{display:block; background:rgba(57,217,138,0.1); border:1px solid var(--accent-dim); color:var(--accent);}
  #feedbackBox.bad{display:block; background:rgba(255,107,107,0.08); border:1px solid var(--bad-dim); color:var(--bad);}
  #feedbackBox .partial{color:var(--amber); font-family:var(--mono); font-size:12px; margin-top:6px;}
  #feedbackBox .expl{color:var(--text); font-family:var(--sans); font-size:13.5px; margin-top:8px; line-height:1.5;}

  .navRow{display:flex; justify-content:space-between; margin-top:22px; gap:12px;}
  .navRow button{
    font-family:var(--mono); font-size:13px; padding:11px 20px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer;
  }
  .navRow button:hover{border-color:var(--accent);}
  .navRow button:disabled{opacity:.35; cursor:not-allowed;}

  /* ---------- Results / Review / History ---------- */
  #resultsScreen, #historyScreen, #reviewScreen{display:none;}
  .scoreCard{text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:40px 28px; margin-bottom:20px;}
  .scoreCard .big{font-family:var(--mono); font-size:56px; font-weight:700; color:var(--accent);}
  .scoreCard .sub{color:var(--dim); font-family:var(--mono); font-size:13px; margin-top:6px;}
  .scoreCard .sub2{color:var(--amber); font-family:var(--mono); font-size:12px; margin-top:6px;}
  .topicBreakdown{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:20px;}
  .topicBreakdown h3{margin:0 0 10px; font-family:var(--mono); font-size:12px; text-transform:uppercase; color:var(--dim);}
  .topicRow{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
  .topicRow .tname{flex:0 0 210px; color:var(--text);}
  .topicBar{flex:1; height:8px; background:#0a0f16; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .topicBar>div{height:100%; background:linear-gradient(90deg,var(--accent-dim),var(--accent));}
  .topicRow .tscore{width:52px; text-align:right; font-family:var(--mono); color:var(--dim); font-size:12px;}

  .resultsGrid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px; margin-bottom:20px;}
  .rBox{
    aspect-ratio:1/1; border-radius:5px; font-family:var(--mono); font-size:11px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--line);
  }
  .rBox.correct{background:rgba(57,217,138,0.18); color:var(--accent); border-color:var(--accent);}
  .rBox.incorrect{background:rgba(255,107,107,0.15); color:var(--bad); border-color:var(--bad);}
  .rBox.unattempted{background:var(--panel-2); color:var(--dim); border-color:var(--line);}

  .filterRow{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filterRow button{
    font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:20px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer;
  }
  .filterRow button.active{background:rgba(90,169,230,0.14); color:var(--blue); border-color:var(--blue);}

  .actionsRow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .actionsRow button{
    font-family:var(--mono); font-size:13px; padding:12px 22px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer;
  }
  .actionsRow button.primary{background:var(--accent); color:#0a1510; border:none; font-weight:700;}
  .actionsRow button:hover{border-color:var(--accent);}

  .reviewList{display:flex; flex-direction:column; gap:6px;}
  .reviewItem{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
    cursor:pointer; font-size:13.5px; display:flex; justify-content:space-between; gap:10px;
  }
  .reviewItem:hover{border-color:var(--accent);}
  .reviewItem .rstat{font-family:var(--mono); font-size:11px; flex:0 0 auto;}
  .reviewItem .rstat.correct{color:var(--accent);}
  .reviewItem .rstat.incorrect{color:var(--bad);}
  .reviewItem .rstat.unattempted{color:var(--dim);}

  .historyItem{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:13px;}
  .historyItem .hTop{display:flex; justify-content:space-between; font-family:var(--mono); color:var(--dim); margin-bottom:6px; gap:10px; flex-wrap:wrap;}
  .historyItem .hScore{color:var(--accent); font-weight:700;}

  @media(max-width:860px){
    body{flex-direction:column;}
    #sidebar{position:relative; width:100%; height:auto; flex:none;}
    #main{padding:20px 16px 50px;}
    .resultsGrid{grid-template-columns:repeat(6,1fr);}
    .topicRow{flex-wrap:wrap;}
    .topicRow .tname{flex:0 0 110px; font-size:12px;}
    .qStem{font-size:15.5px;}
    pre.code{font-size:12px; padding:12px 12px;}
  }
</style>
</head>
<body>

<div id="sidebar">
  <div>
    <div class="brand">// programming_graphics.py</div>
    <div class="brand-sub">Programming Graphics Reviewer</div>
  </div>

  <div class="sideBlock">
    <label for="setSelect">Question Set</label>
    <select id="setSelect" class="sideSelect"></select>
  </div>

  <div class="sideBlock">
    <label>Mode</label>
    <div id="modeTabs">
      <div class="modeTab" data-mode="study">Study</div>
      <div class="modeTab" data-mode="practice">Practice</div>
      <div class="modeTab" data-mode="exam">Exam</div>
    </div>
  </div>

  <div class="sideBlock">
    <label>Settings</label>
    <div class="toggleRow">
      <span>Shuffle Questions</span>
      <label class="switch"><input type="checkbox" id="shuffleQToggle"><span class="slider"></span></label>
    </div>
    <div class="toggleRow">
      <span>Shuffle Options</span>
      <label class="switch"><input type="checkbox" id="shuffleOToggle"><span class="slider"></span></label>
    </div>
  </div>

  <div class="sideBlock" id="scoreWrap">
    <div class="row"><span>ATTEMPTED</span><span class="val" id="attemptedText">0 / 0</span></div>
    <div class="row"><span>CORRECT</span><span class="val" id="correctText">0</span></div>
    <div class="row"><span>BOOKMARKED</span><span class="val" id="bookmarkedText">0</span></div>
    <div id="progressBarOuter"><div id="progressBarInner"></div></div>
  </div>

  <div id="navGrid"></div>

  <button class="sideActionBtn" id="reviewSideBtn">🔍 Review Questions</button>
  <button class="sideActionBtn" id="historySideBtn">📜 Attempt History</button>
  <button class="sideActionBtn primary" id="resetSideBtn">↺ Reset Session</button>

  <div id="validationBanner"></div>
</div>

<div id="main">

  <div id="quizScreen">
    <div class="topBar">
      <h1 id="setTitle">Module 1</h1>
    </div>

    <div class="qMeta">
      <span id="qCounter">Question 1 / 10</span>
      <div class="tags">
        <span class="tag" id="qTypeTag">SINGLE</span>
        <span class="tag" id="qDiffTag">Easy</span>
        <span class="tag" id="qTopicTag">Topic</span>
      </div>
      <button id="bookmarkBtn">☆ Bookmark</button>
    </div>

    <div class="qStem" id="qStem"></div>
    <div id="qBody"></div>

    <div id="actionRow">
      <button id="submitBtn" disabled>Submit Answer</button>
      <button id="tryAgainBtn" class="warn" style="display:none;">Try Again</button>
      <button id="finishBtn" class="secondary" style="display:none;">Finish &amp; Score</button>
    </div>
    <div id="feedbackBox"></div>
    <div id="solutionBox"></div>

    <div class="navRow">
      <button id="prevBtn">◂ Previous</button>
      <button id="nextBtn">Next ▸</button>
    </div>
  </div>

  <div id="resultsScreen">
    <div class="scoreCard">
      <div class="big" id="scoreBig">0%</div>
      <div class="sub" id="scoreSub">0 of 0 correct</div>
      <div class="sub2" id="scoreWarn"></div>
    </div>
    <div class="topicBreakdown" id="topicBreakdown"></div>
    <div class="resultsGrid" id="resultsGrid"></div>
    <div class="actionsRow">
      <button class="primary" id="retryIncorrectBtn">Retry Incorrect</button>
      <button id="backToQuizBtn">Back to Quiz</button>
      <button id="retakeBtn">Retake Full Set</button>
    </div>
  </div>

  <div id="reviewScreen">
    <div class="topBar"><h1>Review Questions</h1><button class="panelTab" id="closeReviewBtn">✕ Close</button></div>
    <div class="filterRow">
      <button data-f="incorrect" class="active">Incorrect</button>
      <button data-f="unanswered">Unanswered</button>
      <button data-f="bookmarked">Bookmarked</button>
      <button data-f="all">All</button>
    </div>
    <div class="reviewList" id="reviewList"></div>
  </div>

  <div id="historyScreen">
    <div class="topBar"><h1>Attempt History</h1><button class="panelTab" id="closeHistoryBtn">✕ Close</button></div>
    <div id="historyList"></div>
  </div>

</div>

<script>
/* =========================================================================
   QUESTION DATA
   Module 1 — Introduction to OpenGL and the Rendering Pipeline
   Module 2 — Geometric Primitives and Attributes
   Diagnostic Test — Programming Graphics
========================================================================= */
const QUESTION_SETS = {

"module1": {
  title: "Module 1 — Introduction to OpenGL and the Rendering Pipeline",
  questions: [

// ---- OpenGL Fundamentals ----
{id:"m1-fund-1", type:"single", topic:"OpenGL Fundamentals", difficulty:"Easy", source:"Module 1",
 stem:`What is OpenGL?`,
 opts:[["A",`A word-processing file format`],
       ["B",`A computer-graphics rendering API for generating high-quality color images from geometric and image primitives`],
       ["C",`A programming language exclusive to Silicon Graphics hardware`],
       ["D",`A database query language`]], ans:"B",
 explanation:`OpenGL is a computer-graphics rendering API used to generate high-quality color images from geometric and image primitives.`},

{id:"m1-fund-2", type:"single", topic:"OpenGL Fundamentals", difficulty:"Easy", source:"Module 1",
 stem:`Where was OpenGL originally developed?`,
 opts:[["A",`Microsoft`],["B",`Silicon Graphics (SGI)`],["C",`Khronos Group`],["D",`Apple`]], ans:"B",
 explanation:`OpenGL was first developed at Silicon Graphics, or SGI.`},

{id:"m1-fund-3", type:"single", topic:"OpenGL Fundamentals", difficulty:"Easy", source:"Module 1",
 stem:`In what year was OpenGL version 1.0 released?`,
 opts:[["A",`1989`],["B",`1994`],["C",`2001`],["D",`2010`]], ans:"B",
 explanation:`OpenGL version 1.0 was released in 1994.`},

{id:"m1-fund-4", type:"single", topic:"OpenGL Fundamentals", difficulty:"Easy", source:"Module 1",
 stem:`OpenGL is an object-oriented API.`,
 opts:[["A",`True`],["B",`False`]], ans:"B",
 explanation:`OpenGL is not object-oriented.`},

{id:"m1-fund-5", type:"single", topic:"OpenGL Fundamentals", difficulty:"Medium", source:"Module 1",
 stem:`In OpenGL's client-server model, what role does the application play?`,
 opts:[["A",`Server`],["B",`Client`],["C",`Both client and server simultaneously`],["D",`Neither — OpenGL has no client-server model`]], ans:"B",
 explanation:`OpenGL uses a client-server model where the application is the client and the vendor's OpenGL implementation is the server.`},

{id:"m1-fund-6", type:"single", topic:"OpenGL Fundamentals", difficulty:"Medium", source:"Module 1",
 stem:`In OpenGL's client-server model, what role does the vendor's OpenGL implementation play?`,
 opts:[["A",`Client`],["B",`Server`],["C",`Neither`],["D",`Compiler`]], ans:"B",
 explanation:`The vendor's OpenGL implementation acts as the server in the client-server model.`},

{id:"m1-fund-7", type:"single", topic:"OpenGL Fundamentals", difficulty:"Medium", source:"Module 1",
 stem:`Which statement best describes the independence of OpenGL's graphics portion?`,
 opts:[["A",`It requires a specific operating system to run`],
       ["B",`It can be operating-system independent and window-system independent`],
       ["C",`It only runs inside a web browser`],

// ---- Khronos Ecosystem ----

 stem:`What is The Khronos Group?`,

       ["C",`A government regulatory agency`],

 explanation:`The Khronos Group is an industry consortium that develops and manages the open, royalty-free standards in the Khronos Visual Computing Ecosystem.`},

{id:"m1-khronos-2", type:"single", topic:"Khronos Ecosystem", difficulty:"Medium", source:"Module 1",

{id:"m1-khronos-3", type:"single", topic:"Khronos Ecosystem", difficulty:"Medium", source:"Module 1",

 opts:[["A",`OpenCL`],["B",`OpenGL`],["C",`WebGL`],["D",`Vulkan`]], ans:"A",

{id:"m1-khronos-4", type:"single", topic:"Khronos Ecosystem", difficulty:"Medium", source:"Module 1",

{id:"m1-khronos-5", type:"single", topic:"Khronos Ecosystem", difficulty:"Easy", source:"Module 1",

// ---- Rendering Pipeline ----
{id:"m1-pipeline-1", type:"single", topic:"Rendering Pipeline", difficulty:"Easy", source:"Module 1",
 stem:`What is the rendering pipeline?`,
 opts:[["A",`A single function that draws an image instantly`],
       ["B",`A sequence of stages that converts 3D scene data into a 2D image displayed on the screen`],
       ["C",`A storage format for texture files`],
       ["D",`A debugging tool for shader code`]], ans:"B",
 explanation:`The rendering pipeline is a sequence of stages that converts 3D scene data into the final 2D image shown on screen.`},

{id:"m1-pipeline-2", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which statement best distinguishes fixed-function stages from programmable stages in the pipeline?`,
 opts:[["A",`Fixed-function stages are controlled by OpenGL itself; programmable stages run developer-written shaders`],
       ["B",`Programmable stages are controlled by OpenGL itself; fixed-function stages run developer-written shaders`],
       ["C",`Both types of stages run developer-written shaders`],
       ["D",`Neither type of stage can be customized`]], ans:"A",
 explanation:`Fixed-function stages are controlled directly by OpenGL, while programmable stages let developers write their own shader code.`},

{id:"m1-pipeline-3", type:"single", topic:"Rendering Pipeline", difficulty:"Hard", source:"Module 1",
 stem:`Which of the following lists the OpenGL rendering pipeline stages in the correct order?`,
 opts:[["A",`Vertex Shader → Vertex Specification → Rasterization → Primitive Assembly → Fragment Shader → Per-Sample Operations`],
       ["B",`Vertex Specification → Vertex Shader → Primitive Assembly → Geometry Shader (optional) → Rasterization → Fragment Shader → Per-Sample Operations`],
       ["C",`Rasterization → Vertex Specification → Vertex Shader → Fragment Shader → Primitive Assembly → Per-Sample Operations`],
       ["D",`Per-Sample Operations → Fragment Shader → Rasterization → Primitive Assembly → Vertex Shader → Vertex Specification`]], ans:"B",
 explanation:`The correct order is Vertex Specification, Vertex Shader, Primitive Assembly, the optional Geometry Shader, Rasterization, Fragment Shader, then Per-Sample Operations.`},

{id:"m1-pipeline-4", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which stage is the first programmable stage in the rendering pipeline?`,
 opts:[["A",`Vertex Specification`],["B",`Vertex Shader`],["C",`Rasterization`],["D",`Per-Sample Operations`]], ans:"B",
 explanation:`The Vertex Shader is the first programmable stage in the pipeline.`},

{id:"m1-pipeline-5", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which stage groups processed vertices into primitives such as points, lines, and triangles?`,
 opts:[["A",`Vertex Shader`],["B",`Primitive Assembly`],["C",`Fragment Shader`],["D",`Rasterization`]], ans:"B",
 explanation:`Primitive Assembly groups vertices into primitives according to the drawing mode selected.`},

{id:"m1-pipeline-6", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which fixed-function stage converts primitives into fragments?`,
 opts:[["A",`Rasterization`],["B",`Vertex Shader`],["C",`Primitive Assembly`],["D",`Geometry Shader`]], ans:"A",
 explanation:`Rasterization is the fixed-function stage that converts primitives into fragments and clips off-screen portions.`},

{id:"m1-pipeline-7", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which stage determines the final color of each fragment, potentially including per-pixel lighting and texturing?`,
 opts:[["A",`Vertex Shader`],["B",`Primitive Assembly`],["C",`Fragment Shader`],["D",`Vertex Specification`]], ans:"C",
 explanation:`The Fragment Shader determines fragment colors and can perform per-pixel lighting and texturing calculations.`},

{id:"m1-pipeline-8", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which stage is optional and can modify existing primitives or generate new ones?`,
 opts:[["A",`Geometry Shader`],["B",`Rasterization`],["C",`Per-Sample Operations`],["D",`Vertex Specification`]], ans:"A",
 explanation:`The Geometry Shader is an optional programmable stage used for procedural geometry and advanced effects.`},

{id:"m1-pipeline-9", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which stage performs depth testing, stencil testing, blending, and scissoring before the final color is written to the framebuffer?`,
 opts:[["A",`Vertex Shader`],["B",`Primitive Assembly`],["C",`Per-Sample Operations`],["D",`Rasterization`]], ans:"C",
 explanation:`Per-Sample Operations include depth testing, stencil testing, blending, and scissoring.`},

{id:"m1-pipeline-10", type:"single", topic:"Rendering Pipeline", difficulty:"Hard", source:"Module 1",
 stem:`Why does clipping during rasterization improve rendering efficiency?`,
 opts:[["A",`It increases the total number of fragments generated`],
       ["B",`It avoids unnecessary processing of content that falls outside the viewing region`],
       ["C",`It forces every pixel on screen to be recalculated twice`],
       ["D",`It disables the fragment shader entirely`]], ans:"B",
 explanation:`Clipping avoids unnecessary work by discarding portions of primitives that fall outside the visible viewing region.`},

{id:"m1-pipeline-11", type:"single", topic:"Rendering Pipeline", difficulty:"Hard", source:"Module 1",
 stem:`Which statement best distinguishes vertex processing from fragment processing in the pipeline?`,
 opts:[["A",`Vertex processing works per-pixel; fragment processing works per-vertex`],
       ["B",`Vertex processing transforms geometry per vertex; fragment processing computes color per pixel/fragment`],
       ["C",`Both stages perform identical operations on identical data`],
       ["D",`Fragment processing happens before vertex processing in the pipeline`]], ans:"B",
 explanation:`Vertex processing (Vertex Shader) transforms geometry on a per-vertex basis, while fragment processing (Fragment Shader) computes color on a per-pixel/fragment basis, later in the pipeline.`},

{id:"m1-pipeline-12", type:"single", topic:"Rendering Pipeline", difficulty:"Medium", source:"Module 1",
 stem:`Which stage commonly relies on Vertex Buffer Objects and Vertex Array Objects to organize vertex data in memory?`,
 opts:[["A",`Vertex Specification`],["B",`Fragment Shader`],["C",`Per-Sample Operations`],["D",`Rasterization`]], ans:"A",
 explanation:`Vertex Specification defines and organizes vertex data in memory, commonly using Vertex Buffer Objects and Vertex Array Objects.`},

// ---- GLUT Program Structure (code reading) ----
{id:"m1-glut-1", type:"single", topic:"GLUT Program Structure", difficulty:"Easy", source:"Module 1",
 stem:`In the following program, what must be called before any other GLUT or OpenGL function?

#include <iostream>
#include <GL/glut.h>
using namespace std;

void display() {
    glClear(GL_COLOR_BUFFER_BIT);
    glBegin(GL_POLYGON);
    glVertex2f(-0.5f, -0.5f);
    glVertex2f(-0.5f,  0.5f);
    glVertex2f( 0.5f,  0.5f);
    glVertex2f( 0.5f, -0.5f);
    glEnd();
    glFlush();
}

int main(int argc, char** argv) {
    glutInit(&argc, argv);
    glutCreateWindow("simple");
    glutDisplayFunc(display);
    glutMainLoop();
}`,
 opts:[["A",`glutCreateWindow("simple")`],["B",`glutInit(&argc, argv)`],["C",`glutDisplayFunc(display)`],["D",`glutMainLoop()`]], ans:"B",
 explanation:`glutInit(&argc, argv) initializes GLUT and must be called before any other GLUT or OpenGL function.`},

{id:"m1-glut-2", type:"single", topic:"GLUT Program Structure", difficulty:"Medium", source:"Module 1",
 stem:`In the simple GLUT program shown earlier, what does glutDisplayFunc(display) do?`,
 opts:[["A",`It immediately draws the polygon once and exits`],
       ["B",`It registers display as the callback function invoked whenever the window needs to be redrawn`],
       ["C",`It creates the application window`],
       ["D",`It sets the background color of the window`]], ans:"B",
 explanation:`glutDisplayFunc(display) registers display as the display callback, which is invoked whenever the window must be redrawn.`},

{id:"m1-glut-3", type:"single", topic:"GLUT Program Structure", difficulty:"Medium", source:"Module 1",
 stem:`When is the display callback registered by glutDisplayFunc invoked?`,
 opts:[["A",`Only once, immediately after glutInit is called`],
       ["B",`Whenever the window must be redrawn`],
       ["C",`Only when the program exits`],
       ["D",`Every time the mouse moves, regardless of the window state`]], ans:"B",
 explanation:`The display callback is invoked whenever the window needs to be redrawn.`},

{id:"m1-glut-4", type:"single", topic:"GLUT Program Structure", difficulty:"Medium", source:"Module 1",
 stem:`Why should glutMainLoop() be the last statement in main()?`,
 opts:[["A",`Because it deallocates all OpenGL resources`],
       ["B",`Because it starts an infinite event-processing loop that does not return`],
       ["C",`Because C++ requires the last statement in main to be a function call`],
       ["D",`It has no particular reason and could be placed anywhere`]], ans:"B",
 explanation:`glutMainLoop() starts an infinite event-processing loop, so any code after it would never execute.`},

{id:"m1-glut-5", type:"single", topic:"GLUT Program Structure", difficulty:"Easy", source:"Module 1",
 stem:`What does glClear(GL_COLOR_BUFFER_BIT) do at the start of display()?`,
 opts:[["A",`It clears the color buffer`],["B",`It closes the window`],["C",`It flushes command execution`],["D",`It creates a new vertex list`]], ans:"A",
 explanation:`glClear(GL_COLOR_BUFFER_BIT) clears the color buffer before new content is drawn.`},

{id:"m1-glut-6", type:"single", topic:"GLUT Program Structure", difficulty:"Medium", source:"Module 1",
 stem:`Given four glVertex2f calls at (-0.5,-0.5), (-0.5,0.5), (0.5,0.5), (0.5,-0.5) between glBegin(GL_POLYGON) and glEnd(), what shape does the program draw?`,
 opts:[["A",`A single point`],["B",`A filled square (a four-sided polygon)`],["C",`A triangle`],["D",`Two separate line segments`]], ans:"B",
 explanation:`Four vertices at the corners (-0.5,-0.5), (-0.5,0.5), (0.5,0.5), (0.5,-0.5) form a filled square using GL_POLYGON.`},

// ---- OpenGL Naming Convention ----
{id:"m2-naming-1", type:"single", topic:"OpenGL Naming Convention", difficulty:"Easy", source:"Module 2",
 stem:`In the command glVertex3fv(v), what does the "3" indicate?`,
 opts:[["A",`The function version number`],["B",`The number of components supplied — x, y, and z`],["C",`The number of vertices in the primitive`],["D",`The size of the vector in bytes`]], ans:"B",
 explanation:`The number in an OpenGL command name indicates how many components are supplied — 3 means x, y, and z.`},

{id:"m2-naming-2", type:"single", topic:"OpenGL Naming Convention", difficulty:"Easy", source:"Module 2",
 stem:`In the command glVertex3fv(v), what does the "f" indicate?`,
 opts:[["A",`That the arguments are floats`],["B",`That the function is "final"`],["C",`That the arguments are byte-typed`],["D",`That the function operates on fragments`]], ans:"A",
 explanation:`The letter suffix indicates data type; "f" means the arguments are floating-point values.`},

{id:"m2-naming-3", type:"single", topic:"OpenGL Naming Convention", difficulty:"Medium", source:"Module 2",
 stem:`In the command glVertex3fv(v), what does the trailing "v" indicate?`,
 opts:[["A",`That the vertex is "visible"`],["B",`That the arguments are supplied as a vector (array) rather than individually`],["C",`That the coordinates are in view space`],["D",`That the function is deprecated`]], ans:"B",
 explanation:`The trailing "v" means the arguments are supplied as a vector; omitting it means scalar arguments are passed directly, as in glVertex2f(x, y).`},

{id:"m2-naming-4", type:"single", topic:"OpenGL Naming Convention", difficulty:"Medium", source:"Module 2",
 stem:`Which data-type suffix denotes unsigned integer components?`,
 opts:[["A",`i`],["B",`us`],["C",`ui`],["D",`ub`]], ans:"C",
 explanation:`"ui" is the suffix for unsigned int, as opposed to "i" (int), "us" (unsigned short), and "ub" (unsigned byte).`},

{id:"m2-points-1", type:"single", topic:"Point Primitives", difficulty:"Easy", source:"Module 2",

{id:"m2-points-2", type:"single", topic:"Point Primitives", difficulty:"Easy", source:"Module 2",

{id:"m2-lines-2", type:"single", topic:"Line Primitives", difficulty:"Medium", source:"Module 2",

{id:"m2-lines-3", type:"single", topic:"Line Primitives", difficulty:"Hard", source:"Module 2",

       ["C",`7 lines are drawn; every vertex is used twice`],
       ["D",`3 lines are drawn; the first vertex is ignored`]], ans:"B",

How many lines are rendered?`,

{id:"m2-strip-2", type:"single", topic:"Line Primitives", difficulty:"Easy", source:"Module 2",

{id:"m2-strip-3", type:"single", topic:"Line Primitives", difficulty:"Medium", source:"Module 2",

{id:"m2-stipple-4", type:"single", topic:"Line Width & Stippling", difficulty:"Medium", source:"Module 2",

// ---- Triangle Primitives ----
{id:"m2-tri-1", type:"single", topic:"Triangle Primitives", difficulty:"Easy", source:"Module 2",
 stem:`Which statement best describes how GL_TRIANGLES renders vertices?`,
 opts:[["A",`It draws one connected fan of triangles sharing the first vertex`],
       ["B",`It draws independent triangles, with each group of three vertices forming one triangle`],
       ["C",`It draws a single triangle regardless of vertex count`],
       ["D",`It connects every vertex to every other vertex`]], ans:"B",
 explanation:`GL_TRIANGLES draws independent triangles — every group of three vertices produces one triangle.`},

{id:"m2-tri-2", type:"single", topic:"Triangle Primitives", difficulty:"Medium", source:"Module 2",
 stem:`With n vertices supplied to GL_TRIANGLES, how many triangles are produced?`,
 opts:[["A",`n`],["B",`floor(n / 2)`],["C",`floor(n / 3)`],["D",`floor(n / 4)`]], ans:"C",
 explanation:`GL_TRIANGLES produces floor(n / 3) triangles, since every group of three vertices forms one triangle.`},

{id:"m2-tri-3", type:"single", topic:"Triangle Primitives", difficulty:"Hard", source:"Module 2",
 stem:`If GL_TRIANGLES is given 8 vertices, how many triangles are drawn?`,
 opts:[["A",`1`],["B",`2`],["C",`3`],["D",`8`]], ans:"B",
 explanation:`floor(8 / 3) = 2 triangles are drawn; the remaining 2 vertices don't form a complete group and are ignored.`},

// ---- Polygon Primitives ----
{id:"m2-poly-1", type:"single", topic:"Polygon Primitives", difficulty:"Medium", source:"Module 2",
 stem:`What is the minimum number of vertices GL_POLYGON needs to render anything?`,
 opts:[["A",`1`],["B",`2`],["C",`3`],["D",`4`]], ans:"C",
 explanation:`GL_POLYGON requires at least three vertices; with fewer, nothing is rendered.`},

{id:"m2-poly-2", type:"single", topic:"Polygon Primitives", difficulty:"Easy", source:"Module 2",
 stem:`What shape does GL_POLYGON draw when given six vertices, as in the source example with vertices at (0.1,0.1), (0.6,0.1), (0.7,0.3), (0.6,0.6), (0.1,0.6), (0.0,0.3)?`,
 opts:[["A",`Two separate triangles`],["B",`A single filled convex hexagon`],["C",`A closed but unfilled outline only`],["D",`Six separate points`]], ans:"B",
 explanation:`GL_POLYGON draws one filled convex n-sided polygon; six vertices produce a filled hexagon.`},

// ---- Triangle Strip & Fan ----
{id:"m2-fan-1", type:"single", topic:"Triangle Strip & Fan", difficulty:"Medium", source:"Module 2",
 stem:`In GL_TRIANGLE_STRIP, which vertices form the second triangle?`,
 opts:[["A",`v0, v1, v2`],["B",`v1, v2, v3`],["C",`v0, v2, v3`],["D",`v2, v3, v4`]], ans:"B",
 explanation:`The first triangle uses v0, v1, v2; the second uses v1, v2, v3.`},

{id:"m2-fan-2", type:"single", topic:"Triangle Strip & Fan", difficulty:"Medium", source:"Module 2",
 stem:`With 4 vertices supplied, how many triangles does GL_TRIANGLE_STRIP produce?`,
 opts:[["A",`1`],["B",`2`],["C",`3`],["D",`4`]], ans:"B",
 explanation:`GL_TRIANGLE_STRIP forms the first triangle from the first 3 vertices, then one additional triangle per extra vertex — 2 triangles from 4 vertices.`},

{id:"m2-fan-3", type:"single", topic:"Triangle Strip & Fan", difficulty:"Easy", source:"Module 2",
 stem:`In GL_TRIANGLE_FAN, which vertex is shared by every triangle in the fan?`,
 opts:[["A",`The last vertex supplied`],["B",`The first vertex supplied (v0)`],["C",`The middle vertex`],["D",`No vertex is shared`]], ans:"B",
 explanation:`GL_TRIANGLE_FAN forms triangles as v0,v1,v2 then v0,v2,v3 then v0,v3,v4 and so on — always sharing the first vertex.`},

{id:"m2-fan-4", type:"single", topic:"Triangle Strip & Fan", difficulty:"Hard", source:"Module 2",
 stem:`Which statement best distinguishes GL_TRIANGLE_STRIP from GL_TRIANGLE_FAN?`,
 opts:[["A",`Strip triangles each share the previous triangle's last two vertices; fan triangles all share the very first vertex`],
       ["B",`Strip and fan behave identically`],
       ["C",`Fan triangles never share any vertices; strip triangles share all vertices`],
       ["D",`Strip requires exactly 3 vertices; fan requires exactly 4`]], ans:"A",
 explanation:`In a strip, each new triangle shares the last two vertices of the previous one. In a fan, every triangle shares the first vertex.`},

// ---- Quad Primitives ----
{id:"m2-quad-1", type:"single", topic:"Quad Primitives", difficulty:"Medium", source:"Module 2",
 stem:`With n vertices supplied to GL_QUADS, how many quadrilaterals are rendered?`,
 opts:[["A",`n`],["B",`floor(n / 2)`],["C",`floor(n / 3)`],["D",`floor(n / 4)`]], ans:"D",
 explanation:`GL_QUADS renders floor(n / 4) independent quadrilaterals; excess vertices that don't complete a group of 4 are ignored.`},

{id:"m2-quad-2", type:"single", topic:"Quad Primitives", difficulty:"Hard", source:"Module 2",
 stem:`In GL_QUAD_STRIP, which vertices form the first quadrilateral?`,
 opts:[["A",`v0, v1, v2, v3`],["B",`v0, v1, v3, v2`],["C",`v1, v2, v3, v4`],["D",`v0, v2, v1, v3`]], ans:"B",
 explanation:`In GL_QUAD_STRIP the first quad uses v0, v1, v3, v2 (note the order), and the next uses v2, v3, v5, v4.`},

{id:"m2-quad-3", type:"single", topic:"Quad Primitives", difficulty:"Medium", source:"Module 2",
 stem:`Which statement best distinguishes GL_QUADS from GL_QUAD_STRIP?`,
 opts:[["A",`GL_QUADS draws independent quads; GL_QUAD_STRIP draws connected quads that share edges`],
       ["B",`GL_QUAD_STRIP draws independent quads; GL_QUADS draws connected quads`],
       ["C",`They are two names for the exact same behavior`],
       ["D",`GL_QUADS can only render triangles, not quads`]], ans:"A",
 explanation:`GL_QUADS renders each group of 4 vertices as an independent quadrilateral, while GL_QUAD_STRIP renders connected quads that share edges.`},

{id:"m3-text-1", type:"single", topic:"Text & Raster Positioning", difficulty:"Easy", source:"Module 3",
 stem:`What is the purpose of glRasterPos2f(x, y)?`,
 opts:[["A",`It sets the current raster position in 2D space for pixel-based operations`],
       ["B",`It draws a filled rectangle at (x, y)`],
       ["C",`It moves the mouse cursor to (x, y)`],
       ["D",`It sets the window's title bar position`]], ans:"A",
 explanation:`glRasterPos2f(x, y) sets the current raster position in 2D space, which determines where bitmap text or pixel images will be drawn.`},

{id:"m3-text-2", type:"single", topic:"Text & Raster Positioning", difficulty:"Medium", source:"Module 3",
 stem:`The x, y coordinates passed to glRasterPos2f() are affected by which matrices?`,
 opts:[["A",`Only the viewport matrix`],
       ["B",`The current model-view and projection matrices`],
       ["C",`Only the texture matrix`],
       ["D",`They are never transformed by any matrix`]], ans:"B",
 explanation:`The raster position is transformed by the current model-view and projection matrices, just like any other vertex coordinate.`},

{id:"m3-text-3", type:"single", topic:"Text & Raster Positioning", difficulty:"Medium", source:"Module 3",
 stem:`Within which stage of the graphics pipeline do raster position and bitmap text functions operate?`,
 opts:[["A",`The vertex shader stage`],["B",`The rasterization stage`],["C",`The geometry shader stage`],["D",`The primitive assembly stage`]], ans:"B",
 explanation:`Raster positioning and bitmap text functions operate within the rasterization stage, where pixel-based operations are performed.`},

{id:"m3-text-4", type:"single", topic:"Text & Raster Positioning", difficulty:"Easy", source:"Module 3",
 stem:`What does glutBitmapString() do?`,
 opts:[["A",`It renders a string of bitmap characters at the current raster position using a specified GLUT bitmap font`],
       ["B",`It converts a bitmap image into a string of text`],
       ["C",`It saves the current window contents as a bitmap file`],
       ["D",`It measures the pixel width of a string`]], ans:"A",
 explanation:`glutBitmapString() renders a string of bitmap characters at the current raster position using a specified GLUT bitmap font, commonly for simple on-screen text.`},

{id:"m3-text-5", type:"single", topic:"Text & Raster Positioning", difficulty:"Medium", source:"Module 3",
 stem:`Why must glColor3f() typically be called before glRasterPos2f() when drawing colored text?`,
 opts:[["A",`glRasterPos2f() resets the color to black automatically`],
       ["B",`OpenGL associates the current color with the raster position, so the color should be set before the position`],
       ["C",`glColor3f() cannot be called after glFlush()`],
       ["D",`There is no required order between the two calls`]], ans:"B",
 explanation:`The module notes to set the color before setting the position, since the current color is captured along with the raster position for the text that follows.`},

{id:"m3-freeglut-1", type:"single", topic:"GLUT Requirements", difficulty:"Medium", source:"Module 3",
 stem:`Which toolkit extension provides functions such as drawBitmapString() beyond standard GLUT?`,
 opts:[["A",`freeglut`],["B",`OpenCL`],["C",`Vulkan`],["D",`SDL`]], ans:"A",
 explanation:`drawBitmapString() is an extension of freeglut, so the freeglut headers must be added to the code to use it.`},

{id:"m3-color-1", type:"single", topic:"Setting Up Color", difficulty:"Easy", source:"Module 3",
 stem:`Which call sets the current color to blue, as used before drawing raster text?`,

 explanation:`glColor3f(0.0f, 0.0f, 1.0f) sets the current color to blue.`},

{id:"m3-color-2", type:"single", topic:"Setting Up Color", difficulty:"Easy", source:"Module 3",
 stem:`Which glColor3f() call produces magenta?`,
 opts:[["A",`glColor3f(1.0f, 1.0f, 0.0f)`],["B",`glColor3f(0.0f, 1.0f, 1.0f)`],["C",`glColor3f(1.0f, 0.0f, 1.0f)`],["D",`glColor3f(1.0f, 1.0f, 1.0f)`]], ans:"C",

{id:"m3-color-3", type:"single", topic:"Setting Up Color", difficulty:"Easy", source:"Module 3",
 stem:`Which glColor3f() call produces yellow?`,
 opts:[["A",`glColor3f(1.0f, 1.0f, 0.0f)`],["B",`glColor3f(0.0f, 1.0f, 0.0f)`],["C",`glColor3f(1.0f, 0.0f, 1.0f)`],["D",`glColor3f(0.0f, 0.0f, 1.0f)`]], ans:"A",
 explanation:`Yellow is full red plus full green with no blue: glColor3f(1.0f, 1.0f, 0.0f).`},

{id:"m3-font-1", type:"single", topic:"GLUT Font Constants", difficulty:"Medium", source:"Module 3",
 stem:`Which best describes GLUT_STROKE_ROMAN?`,
 opts:[["A",`A fixed-size bitmap font used for 2D overlays`],
       ["B",`A stroke font rendered using line segments, allowing scalable vector-based text`],
       ["C",`A constant that disables all text rendering`],
       ["D",`A font used only for numeric characters`]], ans:"B",
 explanation:`GLUT_STROKE_ROMAN is a GLUT stroke font rendered using line segments, making it scalable and suitable for zoomable or transformable text in 3D scenes.`},

{id:"m3-font-2", type:"single", topic:"GLUT Font Constants", difficulty:"Medium", source:"Module 3",
 stem:`What best describes GLUT_BITMAP_HELVETICA_12?`,
 opts:[["A",`A scalable stroke font suited to 3D transformations`],
       ["B",`A fixed-size bitmap font in Helvetica style with 12-point height, used for small readable text in 2D overlays or HUDs`],
       ["C",`A font that only supports uppercase letters`],
       ["D",`A vector font that must be rotated to be legible`]], ans:"B",
 explanation:`GLUT_BITMAP_HELVETICA_12 is a fixed-size bitmap font in Helvetica style with 12-point height, used for rendering small, readable text in 2D overlays or HUDs.`},

{id:"m3-font-3", type:"single", topic:"GLUT Font Constants", difficulty:"Medium", source:"Module 3",
 stem:`What is the key difference between bitmap fonts and stroke fonts in GLUT?`,
 opts:[["A",`Bitmap fonts are fixed-size raster images of characters, while stroke fonts are drawn with scalable line segments`],
       ["B",`Stroke fonts are always faster to render than bitmap fonts`],
       ["C",`Bitmap fonts can be freely scaled in 3D, while stroke fonts cannot`],
       ["D",`There is no functional difference between the two`]], ans:"A",
 explanation:`Bitmap fonts are fixed-size, pixel-based representations, whereas stroke fonts are built from line segments and can be scaled or transformed like other geometry.`},

{id:"m3-font-4", type:"single", topic:"GLUT Font Constants", difficulty:"Easy", source:"Module 3",

{id:"m3-font-5", type:"single", topic:"GLUT Font Constants", difficulty:"Medium", source:"Module 3",

{id:"m3-mouse-5", type:"single", topic:"Mouse Callbacks", difficulty:"Medium", source:"Module 3",

{id:"m3-mouse-7", type:"single", topic:"Mouse Callbacks", difficulty:"Medium", source:"Module 3",

{id:"m3-timer-1", type:"single", topic:"Idle and Timer Callbacks", difficulty:"Medium", source:"Module 3",

{id:"m3-scenario-1", type:"single", topic:"Application Scenario", difficulty:"Hard", source:"Module 3",

{id:"m3-scenario-2", type:"single", topic:"Application Scenario", difficulty:"Hard", source:"Module 3",

{id:"m3-debug-1", type:"single", topic:"Troubleshooting", difficulty:"Hard", source:"Module 3",

{id:"m4b-va-1", type:"single", topic:"Vertex Arrays Overview", difficulty:"Easy", source:"Module 4",
 stem:`What do vertex arrays allow an application to do?`,
 opts:[["A",`Render primitives from vertex and vertex state data stored in blocks of memory`],
       ["B",`Compile shaders at runtime`],
       ["C",`Automatically generate texture coordinates`],
       ["D",`Replace the need for a graphics card`]], ans:"A",
 explanation:`Vertex arrays allow applications to render primitives from vertex and vertex state data stored in blocks of memory.`},

{id:"m4b-va-2", type:"single", topic:"Vertex Arrays Overview", difficulty:"Medium", source:"Module 4",
 stem:`What benefit does OpenGL gain by processing vertices through vertex arrays rather than one glVertex call at a time?`,
 opts:[["A",`It can process the vertices and cache the results for efficient reuse`],
       ["B",`It eliminates the need for a display callback`],
       ["C",`It removes the need to specify a primitive mode`],
       ["D",`It automatically converts 2D primitives into 3D`]], ans:"A",
 explanation:`Vertex arrays let OpenGL process the vertices and cache the results for efficient reuse, unlike issuing individual glVertex calls between glBegin/glEnd.`},

{id:"m4b-buf-1", type:"single", topic:"Buffer Objects", difficulty:"Medium", source:"Module 4",

{id:"m4b-buf-2", type:"single", topic:"Buffer Objects", difficulty:"Medium", source:"Module 4",

/* =========================================================================
   QUESTION-DATA VALIDATION
   Runs over every set on load; reports problems in the sidebar banner.
========================================================================= */
const REQUIRED_META = ['topic','difficulty','source','explanation'];

function validateSet(setId, setObj){
  const errors = [];
  const seenIds = new Set();
  const seenStems = new Map();
  const validQuestions = [];
  (setObj && Array.isArray(setObj.questions) ? setObj.questions : []).forEach((q, idx)=>{
    const tag = `[${setId} #${idx+1}${q && q.id ? ' ('+q.id+')' : ''}]`;
    if(!q || typeof q !== 'object'){ errors.push(`${tag} not a valid object — skipped.`); return; }
    if(!q.id){ errors.push(`${tag} missing id — skipped.`); return; }
    if(seenIds.has(q.id)){ errors.push(`${tag} duplicate id "${q.id}" — skipped.`); return; }
    if(!['single','multi','code_blank'].includes(q.type)){ errors.push(`${tag} invalid type "${q.type}" — skipped.`); return; }
    if(!q.stem){ errors.push(`${tag} missing stem — skipped.`); return; }

    REQUIRED_META.forEach(k=>{ if(!q[k]) errors.push(`${tag} missing ${k}.`); });

    const stemKey = q.stem.replace(/\s+/g,' ').trim().toLowerCase();
    if(seenStems.has(stemKey)){
      errors.push(`${tag} duplicate stem, also in ${seenStems.get(stemKey)} — skipped.`);
      return;
    }
    seenStems.set(stemKey, q.id);

    if(q.type === 'single' || q.type === 'multi'){
      if(!Array.isArray(q.opts) || q.opts.length < 2){ errors.push(`${tag} needs at least 2 opts — skipped.`); return; }
      const keys = q.opts.map(o=>o[0]);
      if(new Set(keys).size !== keys.length){ errors.push(`${tag} duplicate option keys — skipped.`); return; }
      if(q.type === 'single'){
        if(!keys.includes(q.ans)){ errors.push(`${tag} ans "${q.ans}" not among option keys — skipped.`); return; }
      } else {
        if(!Array.isArray(q.ans) || !q.ans.length){ errors.push(`${tag} multi ans must be a non-empty array — skipped.`); return; }
        const missingAns = q.ans.filter(a=>!keys.includes(a));
        if(missingAns.length){ errors.push(`${tag} multi ans ${missingAns.join(',')} not among option keys — skipped.`); return; }
        if(new Set(q.ans).size !== q.ans.length){ errors.push(`${tag} multi ans has duplicates — skipped.`); return; }
        if(q.n != null && q.n !== q.ans.length){ errors.push(`${tag} n (${q.n}) does not match the ${q.ans.length} correct answers — skipped.`); return; }
      }
    }

    if(q.type === 'code_blank'){
      if(!q.code || typeof q.code !== 'string'){ errors.push(`${tag} missing code — skipped.`); return; }
      if(!Array.isArray(q.blanks) || q.blanks.length < 1){ errors.push(`${tag} needs at least 1 blank — skipped.`); return; }
      const placeholderIds = [...q.code.matchAll(/__BLANK_(\d+)__/g)].map(m=>Number(m[1]));
      const blankIds = q.blanks.map(b=>b.id);
      const missing = blankIds.filter(id=>!placeholderIds.includes(id));
      const extra = placeholderIds.filter(id=>!blankIds.includes(id));
      if(missing.length){ errors.push(`${tag} blanks ${missing.join(',')} have no matching __BLANK_n__ in code — skipped.`); return; }
      if(extra.length){ errors.push(`${tag} code has __BLANK_n__ placeholders ${extra.join(',')} with no matching blank def — skipped.`); return; }
      if(new Set(blankIds).size !== blankIds.length){ errors.push(`${tag} duplicate blank ids — skipped.`); return; }
      const badBlank = q.blanks.find(b=> b.id==null || !b.answer);
      if(badBlank){ errors.push(`${tag} a blank is missing id or answer — skipped.`); return; }
    }

    seenIds.add(q.id);
    validQuestions.push(q);
  });
  return {errors, validQuestions};
}

function validateAllSets(){
  const all = [];
  const globalIds = new Set();
  Object.keys(QUESTION_SETS).forEach(setId=>{
    const {errors, validQuestions} = validateSet(setId, QUESTION_SETS[setId]);
    errors.forEach(e=>all.push(e));
    validQuestions.forEach(q=>{
      if(globalIds.has(q.id)) all.push(`[global] id "${q.id}" is reused across sets.`);
      globalIds.add(q.id);
    });
  });
  return all;
}

/* =========================================================================
   APP STATE & PERSISTENCE
========================================================================= */
const LS_HISTORY = 'pgr_history_v1';
const LS_SETTINGS = 'pgr_settings_v1';
const LS_LAST = 'pgr_last_v1';
function lsGet(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let settings = lsGet(LS_SETTINGS, {shuffleQ:false, shuffleO:false});
if(typeof settings !== 'object' || settings === null) settings = {shuffleQ:false, shuffleO:false};

const lastState = lsGet(LS_LAST, null);
let activeSetId = (lastState && QUESTION_SETS[lastState.setId]) ? lastState.setId : Object.keys(QUESTION_SETS)[0];
let activeMode = (lastState && ['study','practice','exam'].includes(lastState.mode)) ? lastState.mode : 'study';

let allQuestions = [];      // validated pool for active set
let order = [];             // indices into allQuestions, current run order
let current = 0;
let answers = {};           // qid -> {selected, submitted, correct, attempts}
let bookmarks = new Set();  // qid strings, per active set
let finished = false;
let optionOrderMap = {};    // qid -> shuffled opts array (copy)
let reviewFilter = 'incorrect';

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function sessionKey(setId, mode){ return `pgr_session_v1_${setId}_${mode}`; }
function bookmarkKey(setId){ return `pgr_bookmarks_v1_${setId}`; }

function saveSession(){
  lsSet(sessionKey(activeSetId, activeMode), {order, current, answers, finished});
  lsSet(LS_LAST, {setId: activeSetId, mode: activeMode});
}
function loadSession(){ return lsGet(sessionKey(activeSetId, activeMode), null); }
function saveBookmarks(){ lsSet(bookmarkKey(activeSetId), Array.from(bookmarks)); }
function loadBookmarks(){ bookmarks = new Set(lsGet(bookmarkKey(activeSetId), [])); }
function pushHistory(entry){
  const hist = lsGet(LS_HISTORY, []);
  hist.unshift(entry);
  lsSet(LS_HISTORY, hist.slice(0, 100));
}
